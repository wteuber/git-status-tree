name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Ruby ${{ matrix.ruby }})
    # ubuntu-22.04 still provides a prebuilt Ruby 2.6 (the support floor);
    # newer runner images do not.
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        ruby: ['2.6', '3.4', '4.0']
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          # The suite is stdlib-only (minitest + the coverage extension), so it
          # needs no gems and no Bundler. Skipping Bundler also avoids trying to
          # install a modern Bundler on Ruby 2.6, which is unsupported there.
          bundler: none
      # Runs the whole suite (test/**/test_*.rb) on minitest and fails if
      # library line coverage drops below the threshold.
      - name: Run tests with coverage
        run: ruby test/coverage.rb

  lint:
    name: RuboCop (2.6 compatibility)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs RuboCop and its plugins from Gemfile.lock (exact versions are
      # pinned in the Gemfile), so CI lints with the same cops as a local
      # `bundle exec rubocop`. Unlike the test jobs, this one runs on a modern
      # Ruby, where the locked Bundler and RuboCop work.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - name: Lint
        run: bundle exec rubocop
