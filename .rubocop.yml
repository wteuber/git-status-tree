# TargetRubyVersion is pinned to the support floor (Ruby 2.6, the stock Ruby on
# macOS) so RuboCop flags any syntax or APIs newer than 2.6 understands before
# an end user on system Ruby ever hits them.
AllCops:
  TargetRubyVersion: 2.6
  NewCops: enable

# Library classes may be up to 220 lines: the 2.6-compatible classic
# `def ... end` predicates are more verbose than the endless method definitions
# (Ruby 3.0+) they replaced. Test classes are exempt (many test methods).
Metrics/ClassLength:
  Max: 220
  Exclude:
    - 'test/**/*'

# Library methods may be up to 20 lines. Test methods are exempt (setup plus
# assertions).
Metrics/MethodLength:
  Max: 20
  Exclude:
    - 'test/**/*'

# Test methods are exempt (many assignments and assertions).
Metrics/AbcSize:
  Exclude:
    - 'test/**/*'

# Test files are exempt (long blocks in test setup).
Metrics/BlockLength:
  Exclude:
    - 'test/**/*'
